name: OSV Scanner

on:
  push:
    branches: ["main", "development"]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "go.mod"
      - "go.sum"
      - "agent-sdk/package-lock.json"
      - ".github/workflows/osv-scanner.yml"
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "go.mod"
      - "go.sum"
      - "agent-sdk/package-lock.json"
      - ".github/workflows/osv-scanner.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.3.1
    with:
      scan-args: |-
        --recursive
        ./

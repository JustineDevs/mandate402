name: CI

on:
  push:
    branches: ["main", "development"]
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.scope.outputs.app }}
      workers: ${{ steps.scope.outputs.workers }}
      go: ${{ steps.scope.outputs.go }}
      contracts: ${{ steps.scope.outputs.contracts }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: scope
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/change-scope.sh github

  app:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:repo-safety
      - run: pnpm check:biome
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm exec eslint src e2e playwright.config.ts next.config.ts eslint.config.mjs vitest.config.ts
      - run: pnpm build
        env:
          APP_ENV: test
          MANDATE402_PERSISTENCE_MODE: sqlite
          MANDATE402_SITE_URL: http://127.0.0.1:3001
          NEXT_PUBLIC_CONSOLE_AUTH_SESSION_CHECK_MS: "1500"
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-test-anon-key-not-a-real-secret
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm run test:e2e
        env:
          PLAYWRIGHT_NEXT_PREBUILT: "1"

  workers:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.workers == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --maxWorkers 1 src/workers/__tests__/mandate402-worker.test.ts src/lib/__tests__/worker-load.test.ts
      - run: pnpm workers:dry-run
      - run: pnpm cloudflare:dry-run

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mandate402_test
          POSTGRES_USER: mandate402
          POSTGRES_PASSWORD: mandate402
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      MANDATE402_PERSISTENCE_MODE: postgres
      MANDATE402_DATABASE_URL: postgres://mandate402:mandate402@127.0.0.1:5432/mandate402_test
      MANDATE402_DATABASE_DIRECT_URL: postgres://mandate402:mandate402@127.0.0.1:5432/mandate402_test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --maxWorkers 1 src/app/api/__tests__/routes.test.ts src/lib/__tests__/execution-worker.test.ts src/lib/__tests__/worker-load.test.ts

  contracts:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: cd contracts && FOUNDRY_CACHE_PATH=cache FOUNDRY_OUT=out forge test

  go:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go build -buildvcs=false .

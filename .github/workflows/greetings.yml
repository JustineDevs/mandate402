name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ env.GH_TOKEN }}
          issue-message: >
            Thanks for opening this issue. Please make sure the problem, goal,
            lane, acceptance criteria, and out-of-scope boundaries are explicit.
          pr-message: >
            Thanks for the pull request. Please confirm linked issue scope,
            verification, deployment assumptions, and remaining blockers in the PR body.

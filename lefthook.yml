pre-commit:
  parallel: false
  commands:
    repo-safety:
      run: pnpm check:repo-safety
    biome:
      run: pnpm check:biome
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
    contracts:
      run: node scripts/precommit-contracts.mjs
    go:
      run: mkdir -p "$(pwd)/.tmp/go-build-cache" "$(pwd)/.tmp/go-tmp" && GOCACHE=$(pwd)/.tmp/go-build-cache GOTMPDIR=$(pwd)/.tmp/go-tmp go test ./...

pre-push:
  parallel: true
  commands:
    release-readiness:
      run: pnpm check:release-readiness
    ci-all:
      run: pnpm ci:all
